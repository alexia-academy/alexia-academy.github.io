name: Surveillance du site
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Controles
        run: |
          set -u
          SB="https://phqfpqzrpdfvpewkvqdh.supabase.co"
          KEY="sb_publishable_W-z46a0Mhkojf2X8YkTJ8A_QJNKWmHA"
          SITE="https://alexia-academy.github.io"
          ERR=0
          for p in "" espace cgv mentions-legales confidentialite pourquoi-ia; do
            c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE/$p")
            echo "page /$p -> $c"; [ "$c" = "200" ] || { echo "::error::Page /$p en panne ($c)"; ERR=1; }
          done
          # base de donnees active (cette requete garde aussi la base eveillee)
          c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SB/rest/v1/alex_leads?select=id&limit=1" -H "apikey: $KEY")
          echo "base de donnees -> $c"; case "$c" in 200|401|403) ;; *) echo "::error::Base de donnees injoignable ($c)"; ERR=1;; esac
          # connexion e-mail + Google actives
          s=$(curl -s --max-time 20 "$SB/auth/v1/settings" -H "apikey: $KEY")
          echo "$s" | grep -q '"google":true' || { echo "::error::Connexion Google desactivee"; ERR=1; }
          echo "$s" | grep -q '"email":true' || { echo "::error::Connexion e-mail desactivee"; ERR=1; }
          # redirection Google OAuth
          c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SB/auth/v1/authorize?provider=google&redirect_to=$SITE/espace" -H "apikey: $KEY")
          echo "redirection Google -> $c"; [ "$c" = "302" ] || { echo "::error::Redirection Google en panne ($c)"; ERR=1; }
          exit $ERR

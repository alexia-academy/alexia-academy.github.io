<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#070a1c;--bg2:#0d1230;--card:#111742;--text:#f2f4ff;--muted:#aab1d8;--accent:#7c5cff;--accent2:#22d3ee;--line:rgba(255,255,255,.1);--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:0;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:10px}
/* --- connexion --- */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{position:relative;background:url(assets/hero-fond.jpg) center/cover;display:flex;align-items:flex-end;padding:40px}
.auth-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,28,.2),rgba(7,10,28,.9))}
.auth-art div{position:relative;z-index:1;max-width:460px}.auth-art h1{font-size:clamp(1.8rem,3.4vw,2.8rem);line-height:1.1}
.auth-art p{color:var(--muted);margin-top:10px}
.auth-box{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(20px,6vw,90px);gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem}.logo img{width:34px;height:34px;border-radius:9px}
.tabs{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:12px;margin-top:10px}
.tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--text)}
label{display:grid;gap:6px;font-size:.85rem;font-weight:700;color:var(--muted)}
input{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:#fff;color:#111;border:0}
.note{font-size:.78rem;color:var(--muted)}
.perk{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#22C55E 10%,transparent);border:1px solid color-mix(in srgb,#22C55E 40%,transparent);font-size:.85rem;font-weight:700}
/* --- tableau de bord --- */
#app{display:none;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:6px}
.side .logo{padding:4px 8px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:700;color:var(--muted);border:0;background:transparent;text-align:left;width:100%}
.nav:hover{background:var(--card);color:var(--text)}.nav.on{background:var(--card);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav img{width:22px;height:22px;object-fit:contain}
.side .grow{flex:1}
.vipside{padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(245,196,81,.18),rgba(124,92,255,.15));border:1px solid rgba(245,196,81,.4);font-size:.82rem}
.vipside b{display:block;color:#F5C451;margin-bottom:4px}
main{padding:22px clamp(16px,3vw,40px) 60px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h1{font-size:clamp(1.3rem,2.4vw,1.8rem)}
.me{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bg2);border:2px solid var(--accent);display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:contain}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
.stat{padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.stat b{font-size:1.6rem;display:block}.stat span{color:var(--muted);font-size:.85rem}
h2{font-size:1.25rem;margin:4px 0 14px;display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:30px}
.fc{border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.fc:hover{transform:translateY(-3px);box-shadow:0 12px 30px color-mix(in srgb,var(--c) 25%,transparent)}
.fc img.ban{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.fc .fb{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}
.fc h3{font-size:1rem}
.bar{height:7px;border-radius:99px;background:var(--bg2);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.fc .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:700}
.badge{align-self:flex-start;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--text);border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.fc.locked img.ban{filter:grayscale(.55) brightness(.6)}
.fc .fb .btn{margin-top:auto}
.price{font-weight:900}.price s{color:var(--muted);font-weight:600;margin-left:6px;font-size:.85rem}
.empty{padding:22px;border-radius:var(--r);border:1px dashed var(--line);color:var(--muted)}
/* profil */
.pcard{padding:22px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);max-width:760px}
.pbig{display:flex;align-items:center;gap:18px;margin-bottom:18px}.pbig .av{width:84px;height:84px;font-size:1.8rem;border-width:3px}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin:12px 0 18px}
.avs button{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--bg2);padding:8px;transition:.2s}
.avs button:hover{border-color:var(--accent)}.avs button.on{border-color:var(--accent2);box-shadow:0 0 18px rgba(34,211,238,.4)}
.avs img{width:100%;height:100%;object-fit:contain}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:9}
.mob-nav{display:none}
@media(max-width:900px){
 #auth{grid-template-columns:1fr}.auth-art{min-height:220px;padding:24px}
 #app{grid-template-columns:1fr}.side{display:none}
 .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--bg2);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .mob-nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:.66rem;font-weight:700;color:var(--muted);padding:4px}
 .mob-nav button.on{color:var(--text)}.mob-nav img{width:24px;height:24px;object-fit:contain}
 main{padding-bottom:90px}.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:12px}.stat b{font-size:1.2rem}
 .row2{grid-template-columns:1fr}.me span{display:none}
}

h1,h2{letter-spacing:-.02em}
